name: My First GitHub Actions

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Test HTML file
        run: |
          test -f index.html
          echo "index.html exists"

      - name: Success message
        run: echo "GitHub Actions pipeline completed successfully!"
